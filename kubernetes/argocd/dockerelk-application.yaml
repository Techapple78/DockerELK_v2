apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dockerelk-v2
  namespace: argocd
spec:
  project: dockerelk-v2
  source:
    repoURL: https://github.com/Techapple78/DockerELK_v2.git
    targetRevision: migration/v1-to-v2-data-refactor
    path: kubernetes/overlays/lab-k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: dockerelk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
