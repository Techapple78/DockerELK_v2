name: dockerelk-staging

services:
  elasticsearch:
    image: dockerelk_elastic
    build:
      context: Elastic/
    volumes:
      - "./.data-staging:/usr/share/elasticsearch/data"
      - ./Elastic/config/elasticsearch.yml:/etc/elasticsearch/elasticsearch.yml:ro
    ports:
      - "19200:9200"
      - "19300:9300"
    environment:
      ES_JAVA_OPTS: "-Xmx768m -Xms256m"
    networks:
      - elk-staging

  logstash:
    image: dockerelk_logstash
    build:
      context: Logstash/
    depends_on:
      - elasticsearch
    volumes:
      - ./Logstash/config/:/usr/share/logstash/config/:ro
      - ./Logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "15044:5044"
      - "11514:10514"
      - "11514:10514/udp"
    environment:
      LS_JAVA_OPTS: "-Xmx768m -Xms256m"
    networks:
      - elk-staging

  kibana:
    image: dockerelk_kibana
    build:
      context: Kibana/
    volumes:
      - ./Kibana/config/:/usr/share/kibana/config:ro
    depends_on:
      - elasticsearch
    ports:
      - "15601:5601"
    networks:
      - elk-staging

networks:
  elk-staging:
    driver: bridge
